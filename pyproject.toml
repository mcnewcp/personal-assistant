[project]
name = "personal-assistant"
version = "0.1.0"
description = "Ingests the owner's notes, organizes them, and maintains a living wiki about the owner."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_assistant"]

[tool.ruff]
target-version = "py313"
# Prototypes are throwaway standalone scripts carrying their own inline
# dependencies (#11) — outside the application's quality bar.
extend-exclude = ["prototypes"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
