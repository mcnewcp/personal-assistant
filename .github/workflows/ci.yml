name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: ruff
        run: uv run ruff check .

      # `!cancelled()` so a ruff failure still lets the tests report — each
      # check fails the build on its own rather than masking the other.
      - name: pytest
        if: ${{ !cancelled() }}
        run: uv run pytest
